packages:
  - apps/*
  - packages/*

# Refuse versions published less than three days ago (supply-chain hygiene).
minimumReleaseAge: 4320

# A dependency's install script runs only once it is approved here.
strictDepBuilds: true
allowBuilds:
  # Native SQLite binding (prebuilt binary or local compile).
  better-sqlite3: true
  # Platform binary; used directly and through drizzle-kit and vite.
  esbuild: true
  # Downloads its Go binary on install.
  lefthook: true

# drizzle-kit still pulls esbuild 0.18 through the deprecated @esbuild-kit chain
# (GHSA-67mh-4wv8-2f99: its dev server answers cross-origin requests). Force a
# patched version; drop this once drizzle-kit stops depending on @esbuild-kit.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12

# One version of every shared dependency across the workspace.
catalog:
  typescript: ^7.0.2
  # Tracks the runtime (Node 24), not latest.
  "@types/node": ^24.10.0
  zod: ^4.6.7
  vitest: ^5.1.0
  oxlint: ^1.92.0
  oxfmt: ^0.77.0
  lefthook: ^2.2.2
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  esbuild: ^0.28.2
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
